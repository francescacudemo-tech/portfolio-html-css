<!DOCTYPE html>

<head>
  <meta name="robots" content="noindex, nofollow">

  <meta name="author" content="Francesca Cudemo">
  <meta name="theme-color" content="#5b4bf0">

  <!-- Favicon -->
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon.ico" sizes="any">

  <!-- Open Graph (anteprime social) -->
  <meta property="og:title" content="Francesca Cudemo · Junior UX/UI Designer">
  <meta property="og:description" content="Portfolio di Francesca Cudemo, Junior UX/UI Designer. Progetto come le persone interagiscono con i prodotti digitali.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://francescacudemo-tech.github.io/portfolio-html-css/">

  <meta property="og:locale" content="it_IT">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=Syne:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 (solo CSS) + stili del sito compilati da Sass -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/main.css?v=18" rel="stylesheet">
</head>
<body class="home">

  <!-- Titolo della pagina per screen reader e motori di ricerca (non visibile) -->
  <h1 class="visually-hidden">Francesca Cudemo · Junior UX/UI Designer</h1>

  <!-- HOMEPAGE: tre colonne di card (struttura in scss/_home.scss).
       Ogni card ha una classe propria (card-colonna-posizione).
       Per ora solo i tre case study hanno contenuto; le altre card sono vuote. -->
  <main class="home-grid" id="main">

    <!-- Colonna 1: doppia larghezza -->
    <div class="home-col home-col--wide">
      <div class="card-box card-1-1"></div>
      <!-- BARRA CONTATTI: "Ehi, ciao!" si apre e rivela email, LinkedIn e telefono
           (animazione "unfold" in scss/_hello-bar.scss, solo CSS).
           tabindex="-1": su touch il primo tap mette a fuoco la barra e la apre. -->
      <nav class="card-box card-1-2 hello-bar" aria-label="Contatti" tabindex="-1">
        <p class="hello-bar__text">
          <span class="hello-bar__word hello-bar__word--left">Ehi,</span>
          <span class="hello-bar__word hello-bar__word--right">ciao!</span>
        </p>
        <ul class="hello-bar__links">
          <li class="hello-bar__item hello-bar__item--email">
            <a class="hello-bar__link" href="mailto:francesca.cudemo@icloud.com" aria-label="Scrivimi un'email">
              <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
                <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/>
                <path d="m3 7 7.9 5.4a2 2 0 0 0 2.2 0L21 7"/>
              </svg>
            </a>
          </li>
          <li class="hello-bar__item hello-bar__item--linkedin">
            <a class="hello-bar__link" href="https://www.linkedin.com/in/francesca-cudemo-a488b8225/" target="_blank" rel="noopener" aria-label="Profilo LinkedIn (si apre in una nuova scheda)">
              <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
                <rect x="2.5" y="2.5" width="19" height="19" rx="4"/>
                <path d="M8 10.5v6M8 7.5v.01M12 16.5v-6M12 13.25a2.75 2.75 0 0 1 5.5 0v3.25"/>
              </svg>
            </a>
          </li>
          <li class="hello-bar__item hello-bar__item--phone">
            <a class="hello-bar__link" href="tel:+393477106813" aria-label="Chiamami al numero +39 347 710 6813">
              <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
                <path d="M21 16.4v2.8a1.9 1.9 0 0 1-2.07 1.9 18.8 18.8 0 0 1-8.2-2.92 18.5 18.5 0 0 1-5.7-5.7A18.8 18.8 0 0 1 2.1 4.24 1.9 1.9 0 0 1 4 2.17h2.8a1.9 1.9 0 0 1 1.9 1.63c.12.9.34 1.79.66 2.65a1.9 1.9 0 0 1-.43 2L7.73 9.65a15.2 15.2 0 0 0 5.7 5.7l1.2-1.2a1.9 1.9 0 0 1 2-.43c.86.32 1.75.54 2.65.66A1.9 1.9 0 0 1 21 16.4z"/>
              </svg>
            </a>
          </li>
        </ul>
      </nav>
    </div>

    <!-- Colonna 2: i tre case study.
         Copertina che scivola giù e rivela il titolo (stili in scss/_case-cover.scss) -->
    <div class="home-col">
      <article class="card-box card-2-1 case-cover case-cover--guide">
        <h2 class="case-cover__title">
          <a class="case-cover__link stretched-link" href="https://francesca-cudemo.framer.website/case-studies/buddhify-guide" target="_blank" rel="noopener">Buddhify Guide</a>
          <svg class="case-cover__chevron" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false">
            <path d="M7.5 4.5 13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </h2>
        <img class="case-cover__image" src="assets/img/progetti/buddhify-guide-cover.png" width="1005" height="660"
             alt="L'assistente AI Buddhify Guide su due smartphone">
      </article>

      <!-- BUDDHIFY: animazione "Bloom Reveal" (stili in scss/_bloom-card.scss, solo CSS) -->
      <article class="card-box card-2-2 bloom">
        <a class="bloom__link" href="https://francesca-cudemo.framer.website/case-studies/buddhify-redesign" target="_blank" rel="noopener">
          <span class="bloom__panel">
            <img src="assets/img/progetti/buddhify-cover.png" width="1005" height="969" loading="lazy" alt="">
          </span>
          <h2 class="bloom__mask">
            <span class="bloom__title">Buddhify</span>
          </h2>
        </a>
      </article>

      <article class="card-box card-2-3 case-cover case-cover--meditactive">
        <h2 class="case-cover__title">
          <a class="case-cover__link stretched-link" href="https://francesca-cudemo.framer.website/case-studies/meditactive" target="_blank" rel="noopener">MeditActive</a>
          <svg class="case-cover__chevron" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false">
            <path d="M7.5 4.5 13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </h2>
        <img class="case-cover__image" src="assets/img/progetti/meditactive-cover.webp" width="2000" height="1500" loading="lazy"
             alt="Una pila di biglietti da visita lilla con il logo MeditActive">
      </article>
    </div>

    <!-- Colonna 3 -->
    <div class="home-col">
      <div class="card-box card-3-1"></div>
      <div class="card-box card-3-2"></div>
      <!-- CARD CURRICULUM: tre fogli che scorrono in diagonale all'hover
           (stili in scss/_cv-cover.scss, solo CSS). Apre la pagina del CV. -->
      <a class="card-box card-3-3 cv-cover" href="cv.html" aria-label="Apri il curriculum">
        <span class="cv-cover__heading" aria-hidden="true">
          <span class="cv-cover__swap"><span class="cv-cover__first">Curriculum</span><span class="cv-cover__next">Aprilo qui</span></span>
        </span>
        <span class="cv-cover__sheet cv-cover__sheet--back" aria-hidden="true"></span>
        <span class="cv-cover__sheet cv-cover__sheet--middle" aria-hidden="true"></span>
        <span class="cv-cover__sheet cv-cover__sheet--front" aria-hidden="true">
          <span class="cv-cover__name">Francesca Cudemo</span>
          <span class="cv-cover__role">Junior UX/UI Designer</span>
          <span class="cv-cover__docgrid">
            <span><span class="cv-cover__label">Contatti</span><span class="cv-cover__line cv-cover__line--95"></span><span class="cv-cover__line cv-cover__line--84"></span><span class="cv-cover__line cv-cover__line--70"></span><span class="cv-cover__label cv-cover__label--lower">Formazione</span><span class="cv-cover__line cv-cover__line--bold cv-cover__line--84"></span><span class="cv-cover__line cv-cover__line--95"></span></span>
            <span><span class="cv-cover__label">Esperienze</span><span class="cv-cover__line cv-cover__line--bold cv-cover__line--70"></span><span class="cv-cover__line cv-cover__line--95"></span><span class="cv-cover__line cv-cover__line--84"></span><span class="cv-cover__line cv-cover__line--95"></span><span class="cv-cover__line cv-cover__line--70"></span><span class="cv-cover__label cv-cover__label--lower">Competenze</span><span class="cv-cover__line cv-cover__line--bold cv-cover__line--70"></span><span class="cv-cover__line cv-cover__line--95"></span></span>
          </span>
        </span>
      </a>
    </div>

  </main>
</body>
</html>
